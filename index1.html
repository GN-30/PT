<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bree+Serif&family=Caveat:wght@400;700&family=Lobster&family=Monoton&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display+SC:ital,wght@0,400;0,700;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+Pro:ital,wght@0,400;0,700;1,700&family=Work+Sans:ital,wght@0,400;0,700;1,700&display=swap');

        h2{
            font-family: Bree Serif;
            color: white;
            margin-top: 315px;
            

        }
        p{
            font-family: Bree;
            color: white;
            margin-top: -10px;
            font-size: medium;
        }
        button{
            font-family: Bree;
            background-color: rgb(240, 238, 238);
            color: rgb(15, 15, 15);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;

        }
        button:hover{
            border: 1.5px dotted tomato;
            transform: scale3d(1.5px);
            transition: 0.10s ease-in-out;
        }
        
     
        .card{
    width: 250px;
    height: 450px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 20px;
    background: rgba(20, 19, 19, 0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(15, 14, 14, 0.3);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    background-image: url("https://images.unsplash.com/photo-1615719413546-198b25453f85?q=80&w=1936&auto=format&fit=crop");
    background-repeat: no-repeat;
    background-size: cover;
    cursor: pointer;

}
.card:hover{
    box-shadow: 0 8px 20px tomato;
    transform: scale(1.5px);
    transition: 0.10s ease-in-out;}



    </style>
</head>
<body>
    <div class="card">

    
    <div class="content">
        <h2>Happy Meals</h2>
        <p>Discover the best food over the 1,000 restaurants</p>
        <button>Book Now</button>
    </div>
    </div>
    
</body>
</html>
